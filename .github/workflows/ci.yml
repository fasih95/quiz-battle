name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth_service, game_service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        working-directory: ${{ matrix.service }}
        run: ruff check .

      - name: Check migrations are current
        working-directory: ${{ matrix.service }}
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: python manage.py test

  frontend_lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

  build_and_push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend, frontend_lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth_service
            image: quiz-battle-auth
          - service: game_service
            image: quiz-battle-game
          - service: frontend
            image: quiz-battle-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  notify_slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [backend, frontend_lint, build_and_push]
    if: always()
    steps:
      - name: Compute pipeline status
        id: status
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_LINT_RESULT: ${{ needs.frontend_lint.result }}
          BUILD_RESULT: ${{ needs.build_and_push.result }}
        run: |
          if [[ "$BACKEND_RESULT" == "success" && "$FRONTEND_LINT_RESULT" == "success" && "$BUILD_RESULT" == "success" ]]; then
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
            echo "color=#2eb886" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "color=#e01e5a" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ steps.status.outputs.status }}
          COLOR: ${{ steps.status.outputs.color }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_LINT_RESULT: ${{ needs.frontend_lint.result }}
          BUILD_RESULT: ${{ needs.build_and_push.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          payload=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "$COLOR",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Quiz Battle CI — $STATUS*\n*Branch:* \`${{ github.ref_name }}\`\n*Event:* \`${{ github.event_name }}\`\n*Commit:* <$COMMIT_URL|${{ github.sha }}>\n*Backend (lint/migrations/tests):* $BACKEND_RESULT\n*Frontend lint:* $FRONTEND_LINT_RESULT\n*Docker build & push:* $BUILD_RESULT\n<$RUN_URL|View run>"
                    }
                  }
                ]
              }
            ]
          }
          EOF
          )
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
